services:
  - type: web
    name: bytearena
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BYTEARENA_SECRET_KEY
        generateValue: true
      - key: BYTEARENA_ADMIN_USERS
        value: admin
