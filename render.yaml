services:
  - type: web
    name: bytearena
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BYTEARENA_SECRET_KEY
        generateValue: true
      - key: BYTEARENA_ADMIN_USERS
        value: admin
